<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery</title>
</head>
<body>
<div th:insert="navbar.html"></div>
<h1>this is gallery Page</h1>
<hr>
Upload your image
<form method="post" action="gallery" enctype="multipart/form-data">
    <input type="file" name="image">
    <input type="submit" value="UPLOAD IMAGE">
</form>

<hr>
<h4>
    Images from TIBD:
</h4>
<span th:each="image : ${session.totalImages}">
    <img th:src="'data:image/jpeg;base64,' + ${image.getImage()}" style="width:200px;height:200px;"/>
</span>
</body>
</html>
