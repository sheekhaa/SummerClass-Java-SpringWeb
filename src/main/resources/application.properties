# *************** USE YOUR OWN TiDB ***************
# NOTE: your DB_URL env var on Render should include SSL params, e.g.:
# jdbc:mysql://<host>:4000/<db>?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3

spring.application.name=WebPortalApp
server.port=8080


# ==================================================
# Database Configuration
# ==================================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}


# ==================================================
# JPA Configuration - Hibernate
# ==================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ==================================================
# Mail Configuration
# ==================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

jwt.secret=MySuperSecretKey1234567890
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB