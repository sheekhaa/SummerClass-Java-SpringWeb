# *************** USE YOUR OWN TiDB ***************

spring.application.name=MySpringWeb
server.port=8080


# ==================================================
# Database Configuration
# ==================================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}


# ==================================================
# JPA Configuration - Hibernate
# ==================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ==================================================
# Mail Configuration
# ==================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:test}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# ==================================================
# JWT Configuration
# ==================================================

jwt.secret=${JWT_SECRET:mySuperSecretKeyThatIsAtLeast32BytesLongForHS256AlgorithmToWork}
jwt.expiration=86400000


# ==================================================
# Cloudinary Configuration
# ==================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo}


# ==================================================
# Multipart / File Upload Configuration
# ==================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB